openapi: 3.0.0
servers:
  - description: Soile Backend API
    url: https://soile-server.nbe.aalto.fi/
info:
  description: This is the Backend API for the Soile webservice.
  version: "1.0.0"
  title: Soile Backend API
  contact:
    email: thomas.pfau@aalto.fi
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
tags:
  - name: login
    description: Anything connected to login and registration
  - name: project
    description: Operations associated with a project.
  - name: study
    description: Anything to do with running projects / project instances.
  - name: participation
    description: Operations that are used by participants of a project.
  - name: exeriment
    description: Operations associated with experiments
  - name: user
    description: Operations associated with user modifications
  - name: task
    description: Operations associated with Task operations including requests for task ressources etc.
paths:
  /register:
    post:
      tags: 
        - login 
        - user
      summary: Register a new user. 
      operationId: registerUser
      description: Create a new user for the platform. 
      responses:
        '201':
          description: User created
        '400':
          description: bad input. Can be user already exists, email already exists or similar.
        '409':
          description: User (or email) already exists in the user database. 
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInformation'
        description: The data for the user to be created (at least, username, password and email are required necessary).          
  /password/request_reset:
    post:
      tags: 
        - login 
        - user
      summary: Ask for a password reset link for a user. 
      operationId: resetPassword
      description: Ask for a password reset id for a user
      responses:
        '200':
          description: Request received.
        '400':
          description: bad input. 
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetInformation'
        description: The information necessary to request a password reset
        
  /password/one_time_auth:
    post:
      tags: 
        - login 
        - user
      summary: Use a one time token for authentication 
      operationId: oneTimeAuth
      description: Authenticates the user with a one-time password
      parameters:
        - name: token
          in: query
          required: true
          description: The one time token obtained via a reset password request.
          schema:
            type : string
      responses:
        '200':
          description: Authenticated.
        '400':
          description: bad input. 
        '409':
          description: Token invalid. 
                
  /test/auth:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
        - tokenAuth: []
      tags: 
        - login 
      summary: Test whether the login is successfull, if successfull indicates the authenticated user.
      operationId: testAuth
      responses:
        '200':
          description: User authenticated successfully
          content: 
            application/json:
                schema:
                  type: object
                  properties:
                    authenticated: 
                      type: boolean
                      description: true if authenticated, false if not.
                    user: 
                      type: string
                      example: "Admin"
                    roles:
                      type: array
                      items:
                        type: string
                        example: "Admin"
        '401':
          description: No user authenticated
  /login:
    post:
      tags: 
        - login 
      summary: Login as a user
      operationId: loginUser
      description: Log in as a user, receive an access token.
      responses:
        '200':
          $ref: '#/components/responses/LoginSuccessful'     
        '400':
          description: bad input parameter
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
                type: object
                properties:
                  username: 
                    type: string
                    description: the username
                  password: 
                    type: string
                    description: the password
                  remember:
                    type: string
                    description: whether to create a cookie to remember the login for more than a session.. has to be "1" or "0"
                    example: "1"
          application/json:
            schema:
              type: object
              properties:
                username: 
                  type: string
                  description: the username
                password: 
                  type: string
                  description: the password
                remember:
                  type: string
                  description: whether to create a cookie to remember the login for more than a session.. has to be "1" or "0"
                  example: "1"
        description: Login Data, containing username and password in the same schema as the User. 
  /logout:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
        - tokenAuth: []
        - {} # Security on this endpoint is optional. Calling this in an authenticated manner will add a participant to the user. Calling it in a non authenticated manner will create a token that can be used for future authentication.
      tags: 
        - login 
      summary: Logout, invalidating all cookies currently in use.
      operationId: logout
      description: Log out invalidating all cookies and sessions currently in use
      responses:
        '200':
          description: Lgout successfull
        '400':
          description: bad input parameter
                
  /user/list:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - user
      summary: Get a list of users
      operationId: listUsers
      description: |
        Get a list of users with properties and users listed depending on the level of access of the request
      parameters:
        - in: query
          name: searchString
          description: pass an optional search string for looking up users
          required: false
          schema:
            type: string
        - in: query
          name: type
          description: restrict to a specific type of user (PARTICIPANT / USER / RESEARCHER / ADMIN) 
          required: false
          schema:
            type: string
        - in: query
          name: skip
          required: false
          description: number of records to skip for pagination
          schema:
            type: integer
            format: int32
            minimum: 0
        - in: query
          name: limit
          required: false
          description: maximum number of records to return
          schema:
            type: integer
            format: int32
            minimum: 0
      responses:
        '200':
          description: search results matching criteria, content depends on the access level of the request.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: bad input parameter
  /user/create:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - user
      summary: Create a user
      operationId: createUser
      description: Adds a user to the system
      responses:
        '201':
          description: User created
        '400':
          description: 'invalid input, object invalid'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          $ref: '#/components/responses/UserExists'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        description: The data for the user to be created (at least, username, password and email are required necessary).
  /user/delete:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - user
      summary: Create a user
      operationId: removeUser
      description: Remove a user from the system. Must either be requested by the user or an authorized user (i.e. Admin)).
      responses:
        '202':
          description: User deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/UserDoesNotExist'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: 
                  type: string
                  description: the username of the user to delete
                deleteFiles:
                  type: boolean
                  description: "Whether to delete all information for this user from any projects"
  /user/getinfo:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - user
      summary: Get details of a user
      operationId: getUserInfo
      description: Get the details of a user (not the password obviously).
      parameters:
        - name: username
          in: query
          required: true
          description: Username for which info is requested
          schema:
            type : string
            
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictedUserInfo'
          description: The details of the user, no password is supplied... 
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/UserDoesNotExist'
  /user/setinfo:          
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - user
      summary: Set details of a user
      operationId: setUserInfo
      description: Set the details of a user.
      requestBody:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictedUserInfo'
          description: The details of the user, no password is supplied... 
      responses:
        '200':
          description: "Successful update"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestrictedUserInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/UserDoesNotExist'
          
  /user/activeprojects:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
        - tokenAuth: []
      tags:
        - user
      summary: Get the active Projects of a authed user.
      operationId: getUserActiveProjects
      description: This POST will return a list of unique IDs for which the authenticated user has access.
      responses:
        '200':
          description: "Request successfull, returning list of active projects"
          content:
            application/json:
              schema:
                type: array
                items: 
                  type: string
                  example: "Project 2"
                  description: "a list of UUIDs of all projects the authenticated user is participating in."
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/UserDoesNotExist'
          
  /user/setpassword:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - user
      summary: Set password of a user
      operationId: setPassword
      description: Set the password of a user.
      requestBody:
          content:
            application/json:
              schema:
                type: object
                required:
                  - username
                  - password
                properties:
                  username:
                    type: string
                    example: MyUser
                    description: Must not include any @ symbols
                  password:
                    type: string
                    description: the new password
          description: The details of the user, no password is supplied... 
      responses:
        '200':
          description: "Successful update"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/UserDoesNotExist'
  /user/setrole:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - user
      summary: Set the access groups of a user account. 
      operationId: setRole
      description: Set the role of a user account.Only Admins can set roles
      responses:
        '200':
          description: Role updated
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: 'User has no authorization to make this call'
        '410':
          $ref: '#/components/responses/UserDoesNotExist'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: MyUser
                  description: Must not include any @ symbols
                role:
                  type: string
                  example: "Admin"
  /user/setpermissions:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - user
      summary: Set the access groups of a user account. 
      operationId: permissionChange
      description: Set the roles and permissions of a user account. Admins can set all groups/permissions, users can set permissions for Experiments they own.
      responses:
        '200':
          description: Roles updated
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: 'User has no authorization to make this call'
        '410':
          $ref: '#/components/responses/UserDoesNotExist'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: MyUser
                  description: Must not include any @ symbols
                command:
                  type: string
                  example: 'set'
                  description: the type of change. set will replace any permissions currently present (only admins can do this), add will add permissions (can be called by a user who has full permission for the relevant resources), remove will remove them (same as add).
                permissionsProperties:
                  type: object
                  properties:
                    elementType: 
                      type: string
                      description: "whether the permission is a 'TASK', 'PROJECT', 'EXPERIMENT' or 'INSTANCE'"
                      example: "instance"
                    permissionSettings:
                      $ref : '#/components/schemas/PermissionsSettings'
                    
        description: With command set to setCommand, body needs both permissions and roles and will replace permissions, if the requestor has the permissions to do so.
                     With add/delete Command only the added or deleted Roles/permissions need to be supplied.
  /user/getaccess:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - user
      summary: Get the permissions of a specified user. 
      operationId: permissionOrRoleRequest
      description: Get the permissions of a specified user.
      parameters:
        - name: username
          in: query
          required: true
          description: Username for which info is requested
          schema:
            type : string
            
      responses:
        '200':
          $ref: '#/components/responses/AccessOfUser'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/UserDoesNotExist'
  /task/list:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - task
      summary: Get a list of all tasks.
      operationId: getTaskList
      description: Get a list of all public tasks, a task could be private, in which case it is only shown, if the user has access.
      parameters:
        - name: full
          in: query
          required: false
          description: Admin toggle that allows admins to list all available elements
          schema:
            type: boolean
      responses:
        '200':
          description: A List of tasks, with names and IDs
          content:
            application/json:
              schema:
                type: array
                items: 
                  type: object
                  properties:
                    UUID: 
                      type: string
                      example: "1234567"
                    name:
                      type: string
                      example: "Task 1"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call
  /task/codeoptions:
    get:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - task
      summary: Get a list of all supported Code types and versions.
      operationId: getCodeOptions
      description: Retrieve the list of available code types supported by the backend. Includes the versions of those types along with the mimetypes 
      responses:
        '200':
          description: A List of tasks, with names and IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: 
                      type: string
                      description: name of the option
                      example: "QMarkup"
                    versions:
                      type: array
                      items: 
                        type: string
                        description: version strings
                        example: "1.0"
                    mimetype: 
                      type: string
                      description: mimetype of the returned code.
                      example: "application/json"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call         
  /task/{id}/{version}/gettag:
    get:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - task
      summary: Get the tag for the task at the specified version (if any))
      operationId: getTagForTaskVersion
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the task
          schema:
            type : string
        - name: version
          in: path
          required: true
          description: version of the requested task, can be either a tag or a commit id or latest, which would refer to the latest commit. 
          schema:
            type : string
      responses:
        '200':
          description: The task version tag
          content:
            application/json:
              schema:
                type: object
                properties:
                  tag:
                    type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/ResourceDoesNotExist'
  /task/{id}/list:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - task
      summary: Get a list of all tagged versions of a specific task
      operationId: getVersionsForTask
      description: Get a list of all tagged versions of a task, a task could be private, in which case access can be denied
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the task for which versions are requested
          schema:
            type : string
      responses:
        '200':
          description: A List of tasks versions, with Tags and Date information
          content:
            application/json:
              schema:
                type: array
                items: 
                  type: object
                  properties:
                    tag: 
                      type: string
                      example: "Version 1"
                    version:
                      type: string
                      example: "1234567"
                      description: "A string representing a version ID"
                    date:
                      type: number
                      example: 123456789
                      description: "Timestamp in long format.."
                
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/ResourceDoesNotExist' 
  /task/{id}/removetags:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - task
      summary: remove tags for a specific task (does not delete the versions)
      operationId: removeTagsForTask
      description: Removes the specified tags from the task, so that the corrsponding versions are no longer associated with the tag. 
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the task for which versions are requested
          schema:
            type : string
      responses:
        '200':
          description: "success"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/ResourceDoesNotExist'    
      requestBody:
        content: 
          application/json:
            schema:
              type: array
              items:
                type: string
                description: the tags to remove
                example: "Initial Version"
  /task/{id}/delete:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - task
      summary: Delete a task (it will no longer be available for editing, but existing projects using it will still be able to use it)
      operationId: deleteTask
      description: Removes the specified Task from the server. It will no longer be accessible for editing, but projects currently using it will still work.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the task for which versions are requested
          schema:
            type : string
      responses:
        '200':
          description: "success"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/ResourceDoesNotExist'    
          
  /task/{id}/{version}/addtag:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - task
      summary: Add a tag to a version that doesn't have a tag yet.
      operationId: addTagToTaskVersion
      description: Add a tag to a version that doesn't have one yet.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the task to remove
          schema:
            type : string
        - name: version
          in: path
          required: true
          description: version of the task
          schema:
            type : string
      responses:
        '200':
          description: Tag was added
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '409':
          description: "Name already exists" 
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/ResourceDoesNotExist'                        
      requestBody:
        content: 
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The new Tag
                  example: "Initial Version"
  /task/{id}/{version}/filelist:
    get:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - task
      summary: Get a list of all files for the given task at the given version
      operationId: getTaskFileList
      description: Obtain a list of allfiles available for a given task at a given version.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the task for which versions are requested
          schema:
            type : string
        - name: version
          in: path
          required: true
          description: version of the task
          schema:
            type : string            
      responses:
        '200':
          description: A List of Files as a Json Array. Folders are represented as JsonObjects
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/FileDirectory'
                
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/ResourceDoesNotExist'
  /task/{id}/{version}/download:  
    get:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - task
      summary: Download the Task.
      operationId: downloadTask
      description: "This request will return a zipped version of the task, with all resources in a resoue folder and a config and code file."
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the task to download
          schema:
            type : string
        - name: version
          in: path
          required: true
          description: version of the tas to download
          schema:
            type : string
                        
      responses:
        '200':
          description: A tar file containing the requested task
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call   
  /task/upload:  
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - task
      summary: Build a Task based on an uploaded zip file
      operationId: uploadTask
      description: "This end point requires the provision of a zip file containing the data for a task. The Zip file needs to contain all Files required for the task along with a config.cfg and a source.code file which contain the properties and the code of the task respectively. The configuration MUST contain the language and version of the task."
      parameters:
        - name: name
          in: query
          required: true
          description: Name of the task
          schema:
            type : string
        - name: tag
          in: query
          required: true
          description: Tag to be used for this version.
          schema:
            type : string
                        
      responses:
        '200':
          description: A tar file containing the requested task
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid: 
                    type: string
                    description: the UUID of the created task
                  version: 
                    type: string
                    description: The version of the created task.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call         
      requestBody:
        content:
          application/zip:
              schema:
                type: string
                format: binary
  /task/create:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - task
      summary: Create a new task
      operationId: createTask
      description: Create a new empty task and get a UUID as well as an initial version for it.
      parameters:
        - name: name
          in: query
          required: true
