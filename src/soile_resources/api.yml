          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/ResourceDoesNotExist'
  /experiment/{id}/removetags:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - experiment
      summary: remove tags for a specific experiment (does not delete the versions)
      operationId: removeTagsForExperiment
      description: Removes the specified tags from the experiment, so that the corrsponding versions are no longer associated with the tag. 
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the task for which versions are requested
          schema:
            type : string
      responses:
        '200':
          description: "success"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/ResourceDoesNotExist'    
      requestBody:
        content: 
          application/json:
            schema:
              type: array
              items:
                type: string
                description: the tags to remove
                example: "Initial Version"  
  /experiment/{id}/delete:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - experiment
      summary: Delete an Experiment (it will no longer be available for editing, but existing projects using it will still be able to use it)
      operationId: deleteExperiment
      description: Removes the specified Experiment from the server. It will no longer be accessible for editing, but projects currently using it will still work.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the experiment to remove
          schema:
            type : string
      responses:
        '200':
          description: "success"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/ResourceDoesNotExist'    
          
  /experiment/{id}/{version}/addtag:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - experiment
      summary: Add a tag to a version that doesn't have a tag yet.
      operationId: addTagToExperimentVersion
      description: Add a tag to a version that doesn't have one yet.
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the experiment for which versions are requested
          schema:
            type : string
        - name: version
          in: path
          required: true
          description: version of the experiment
          schema:
            type : string
      responses:
        '200':
          description: Tag was added
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '409':
          description: "Name already exists" 
        '403':
          description: User has no authorization to make this call 
        '410':
          $ref: '#/components/responses/ResourceDoesNotExist'   
      requestBody:
        content: 
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The new Tag
                  example: "Initial Version"
  /experiment/create:
    post:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - experiment
      summary: Create a new task
      operationId: createExperiment
      description: Create a new empty task and get a UUID as well as an initial version for it.
      parameters:
        - name: name
          in: query
          required: true
          description: UUID of the task
          schema:
            type : string
            
      responses:
        '200':
          description: New Task created providing a UUID. 
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          description: 'invalid input, object invalid'
        '403':
          description: User has no authorization to make this call 
        '409':
          description: "Name already exists"
  /experiment/{id}/{version}/get:
    get:
      security:
        - cookieAuth: []
        - JWTAuth: []
      tags:
        - experiment
      summary: Get the specified experiment at the specified version
      operationId: getExperiment
      description: Get a experiment at the specified version (commonly latest).
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the task
          schema:
            type : string
            
        - name: version
          in: path
